<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DJWebPlayer</title>
  <meta name="theme-color" content="#15171c">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- ── Side drawer: Library ───────────────────────────────────── -->
  <div id="drawer-overlay" class="drawer-overlay" hidden></div>

  <aside id="library-drawer" class="library-drawer" aria-label="Library" aria-hidden="true">
    <div class="drawer-header">
      <h2 id="library-title"></h2>
      <button id="drawer-close" class="drawer-close" aria-label="Close library">✕</button>
    </div>
    <div class="panel-actions">
      <button id="library-import-folder"></button>
      <button id="library-import-files"></button>
    </div>
    <input id="folder-input" type="file" webkitdirectory hidden>
    <input id="file-input" type="file"
           accept="audio/*,.mp3,.wav,.ogg,.oga,.flac,.m4a,.aac,.weba,.opus"
           multiple hidden>
    <div class="library-toolbar">
      <input id="library-search" type="search" class="search-input">
    </div>
    <div class="library-bulk-bar">
      <button id="library-select-all"></button>
      <button id="library-remove-selected" disabled></button>
      <button id="library-clear" class="is-danger"></button>
    </div>
    <p id="library-empty" class="empty-hint"></p>
    <p id="library-no-results" class="empty-hint" hidden></p>
    <div class="library-table-wrap">
      <table id="library-table" class="library-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="library-check-all" title="Select all"></th>
            <th class="col-name sortable" data-sort="name" id="th-name"></th>
            <th class="col-duration sortable" data-sort="duration" id="th-duration"></th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="library-tbody"></tbody>
      </table>
    </div>
    <div class="drawer-danger">
      <h3 id="danger-title"></h3>
      <button id="danger-reset" class="is-danger"></button>
    </div>
  </aside>

  <!-- ── App shell ──────────────────────────────────────────────── -->
  <div class="app-shell">
    <header class="app-header">
      <button id="burger-btn" class="burger-btn" aria-label="Open library">☰</button>
      <h1>DJWebPlayer</h1>
      <button id="info-btn" class="info-btn" aria-label="About">ℹ v0.2.0</button>
    </header>

    <main class="app-main">

      <!-- Two decks -->
      <div class="decks-row">
        <section class="deck-panel deck-a" aria-label="Deck A">
          <div class="deck-label" id="deck-a-label"></div>
          <div class="deck-track-name is-empty" id="deck-a-track"></div>
          <div class="deck-progress" id="deck-a-progress">
            <div class="deck-progress-fill" id="deck-a-fill"></div>
          </div>
          <div class="deck-times">
            <span id="deck-a-current">0:00</span>
            <span id="deck-a-duration">0:00</span>
          </div>
          <div class="deck-controls">
            <button id="deck-a-play" class="is-primary"></button>
            <button id="deck-a-stop"></button>
            <button id="deck-a-skip"></button>
          </div>
          <div class="deck-volume-row">
            <span class="vol-label">Vol</span>
            <input id="deck-a-volume" type="range" min="0" max="1" step="0.01" value="0.8">
          </div>
        </section>

        <section class="deck-panel deck-b" aria-label="Deck B">
          <div class="deck-label" id="deck-b-label"></div>
          <div class="deck-track-name is-empty" id="deck-b-track"></div>
          <div class="deck-progress" id="deck-b-progress">
            <div class="deck-progress-fill" id="deck-b-fill"></div>
          </div>
          <div class="deck-times">
            <span id="deck-b-current">0:00</span>
            <span id="deck-b-duration">0:00</span>
          </div>
          <div class="deck-controls">
            <button id="deck-b-play" class="is-primary"></button>
            <button id="deck-b-stop"></button>
            <button id="deck-b-skip"></button>
          </div>
          <div class="deck-volume-row">
            <span class="vol-label">Vol</span>
            <input id="deck-b-volume" type="range" min="0" max="1" step="0.01" value="0.8">
          </div>
        </section>
      </div>

      <!-- Crossfader -->
      <section class="crossfader-panel">
        <div class="crossfader-labels">
          <span id="xf-label-a"></span>
          <span id="xf-label-center"></span>
          <span id="xf-label-b"></span>
        </div>
        <input id="crossfader" type="range" min="0" max="1" step="0.001"
               value="0.5" class="crossfader-slider">
        <div class="crossfader-controls">
          <button id="loop-btn" class="btn-toggle"></button>
          <button id="xf-center-btn" class="btn-small"></button>
        </div>
      </section>

      <!-- Playlist -->
      <section class="playlist-panel" aria-label="Playlist">
        <div class="playlist-header">
          <h2 id="playlist-title"></h2>
          <button id="playlist-clear" class="is-danger btn-small"></button>
        </div>
        <p id="playlist-empty" class="empty-hint"></p>
        <ul id="playlist-list" class="item-list playlist-list"></ul>
      </section>

    </main>
  </div>

  <!-- Confirm overlay -->
  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div class="confirm-box">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel"></button>
        <button id="confirm-ok" class="is-danger"></button>
      </div>
    </div>
  </div>

  <!-- About dialog -->
  <div id="about-overlay" class="confirm-overlay" hidden>
    <div class="confirm-box about-box">
      <h2 id="about-title"></h2>
      <p id="about-version-line"></p>
      <p><a id="about-repo-link"
            href="https://github.com/mtedaldi/DJWebPlayer/tree/main"
            target="_blank" rel="noopener"></a></p>
      <div class="confirm-actions">
        <button id="about-close" class="is-primary"></button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
